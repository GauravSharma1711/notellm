services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notellm-postgres-build
    environment:
      POSTGRES_DB: notellm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - notellm_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notellm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  notellm_pg_data: